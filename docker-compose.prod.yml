version: '3.8'

services:
  frontend:
    image: ghcr.io/adityawagh19/kleos/kleos-frontend:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
    restart: always

  backend:
    image: ghcr.io/adityawagh19/kleos/kleos-backend:latest
    env_file:
      - .env
    expose:
      - "8000"
    restart: always
