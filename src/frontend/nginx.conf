server {
    listen 80;
    server_name kleos-ai.duckdns.org;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name kleos-ai.duckdns.org;
    
    ssl_certificate /etc/letsencrypt/live/kleos-ai.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kleos-ai.duckdns.org/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    
    # Root directory for static files
    root /usr/share/nginx/html;
    index index.html;
    
    # Fallback to index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Proxy /api requests to backend container
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket connections for voice
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
